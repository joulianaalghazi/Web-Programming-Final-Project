<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Course Companion — Professor Sign Up</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="student-app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root{
      --primary:#162765;
      --header-bg:#1f2933;
      --page-bg:hsl(210, 22%, 96%);
      --card-bg:#ffffff;
      --border:#e5e7eb;
      --muted:#6b7280;
      --text:#111827;
    }

    *{
      box-sizing:border-box;
    }

    html, body{
      height:100%;
    }

    body{
      margin:0;
      font-family:"Montserrat", sans-serif;
      background:var(--page-bg);
      color:var(--text);
    }

    .header{
      height:120px;
      background:var(--header-bg);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 25px;
    }

    .header .brand{
      margin:0;
      font-size:32px;
      font-weight:800;
      color:#fff;
    }

    .header .role{
      font-size:18px;
      font-weight:500;
    }

    .footer{
      height:50px;
      background:var(--header-bg);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      text-align:center;
    }

    .shell{
      min-height:calc(100vh - 120px - 50px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:26px;
    }

    .backdrop{
      width:min(760px, 100%);
      background:rgba(22, 39, 101, 0.06);
      border:1px solid rgba(17,24,39,.08);
      border-radius:18px;
      padding:28px;
    }

    .container{
      width:100%;
      min-height:520px;
      display:flex;
      overflow:hidden;
      background:var(--card-bg);
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:0 8px 24px rgba(0,0,0,.05);
    }

    .left{
      flex:1;
      padding:32px 30px 28px;
      background:#fff;
    }

    .tag{
      display:inline-block;
      margin-bottom:14px;
      padding:6px 12px;
      border:1px solid rgba(22,39,101,.25);
      border-radius:999px;
      background:rgba(22,39,101,.06);
      color:var(--primary);
      font-size:12px;
      font-weight:600;
      letter-spacing:.8px;
      text-transform:uppercase;
    }

    .left h2{
      margin:0;
      font-size:28px;
      font-weight:800;
      color:var(--text);
    }

    .sub{
      margin:8px 0 16px;
      color:#4b5563;
      font-size:14px;
      line-height:1.4;
    }

    .row{
      display:flex;
      gap:14px;
    }

    .row .field{
      flex:1;
    }

    label{
      display:block;
      margin-top:14px;
      font-size:13px;
      font-weight:700;
      color:var(--text);
    }

    input{
      width:100%;
      margin-top:6px;
      padding:11px 12px;
      border:1px solid var(--border);
      border-radius:12px;
      background:#fff;
      font:inherit;
      outline:none;
    }

    input:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(22,39,101,0.15);
    }

    .btn{
      width:100%;
      margin-top:20px;
      padding:12px;
      border:none;
      border-radius:12px;
      background:var(--primary);
      color:#fff;
      font:inherit;
      font-weight:800;
      cursor:pointer;
    }

    .btn:hover{
      filter:brightness(.97);
    }

    .btn:active{
      transform:translateY(1px);
    }

    .links{
      margin-top:14px;
      font-size:13px;
    }

    .links a{
      display:block;
      margin-top:8px;
      color:var(--primary);
      text-decoration:none;
    }

    .links a:hover{
      text-decoration:underline;
    }

    .message{
      margin-top:14px;
      font-size:13px;
      font-weight:600;
      display:none;
    }

    .message.success{
      color:#166534;
    }

    .message.error{
      color:#b91c1c;
    }

    @media (max-width:700px){
      .row{
        flex-direction:column;
        gap:0;
      }

      .backdrop{
        width:min(95%, 100%);
        padding:20px;
      }

      .left{
        padding:24px 20px;
      }
    }

    /* DARK MODE */
.header-right{
  display:flex;
  align-items:center;
  gap:16px;
}

.theme-btn{
  padding:8px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-family:inherit;
  font-weight:600;
  background:white;
  color:#111827;
}

body.dark-mode{
  background:#0f172a;
  color:#f8fafc;
}

body.dark-mode .header,
body.dark-mode .footer{
  background:#111827;
}

body.dark-mode .backdrop{
  background:rgba(255,255,255,0.03);
  border:1px solid #334155;
}

body.dark-mode .container,
body.dark-mode .left{
  background:#1e293b;
  border:1px solid #334155;
}

body.dark-mode .left h2,
body.dark-mode .sub,
body.dark-mode label,
body.dark-mode .role{
  color:#f8fafc;
}

body.dark-mode .sub{
  color:#e2e8f0;
}

body.dark-mode input{
  background:#334155;
  color:#ffffff;
  border:1px solid #475569;
}

body.dark-mode input::placeholder{
  color:#cbd5e1;
}

body.dark-mode .tag{
  background:#334155;
  border:1px solid #475569;
  color:#f8fafc;
}

body.dark-mode .theme-btn{
  background:#334155;
  color:white;
}

body.dark-mode .links a{
  color:#93c5fd;
}


  </style>
</head>

<body>

  <header class="header">
    <h1>Student Course Companion</h1>
    <div class="header-right">
      <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
      <div class="role">Professor Sign Up</div>
    </div>
  </header>

  <div class="shell">
    <div class="backdrop">
      <div class="container">
        <div class="left">
          <span class="tag">Professor Access</span>

          <h2>Professor Sign Up</h2>
          <p class="sub">Create your account to manage courses, assessments, templates, and analytics.</p>

          <form id="registerForm">
            <div class="row">
              <div class="field">
                <label for="firstName">First Name</label>
                <input id="firstName" type="text" placeholder="Enter first name" required>
              </div>

              <div class="field">
                <label for="lastName">Last Name</label>
                <input id="lastName" type="text" placeholder="Enter last name" required>
              </div>
            </div>

            <label for="email">Email</label>
            <input id="email" type="email" placeholder="example@school.com" required>

            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password" required>

            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" type="password" placeholder="Re-enter your password" required>

            <button class="btn" type="submit">Create Account</button>

            <div id="formMessage" class="message"></div>

            <div class="links">
              <a href="professor-login.html">Back to Login</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    © Student Course Companion
  </footer>

  <script>
//DARK MODE
const themeToggle = document.getElementById("themeToggle");

// load saved theme
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark-mode");
  themeToggle.textContent = "☀️ Light Mode";
}

themeToggle.addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");

  if (document.body.classList.contains("dark-mode")) {
    localStorage.setItem("theme", "dark");
    themeToggle.textContent = "☀️ Light Mode";
  } else {
    localStorage.setItem("theme", "light");
    themeToggle.textContent = "🌙 Dark Mode";
  }
});

    document.getElementById("registerForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const formMessage = document.getElementById("formMessage");

      formMessage.style.display = "none";
      formMessage.className = "message";

      if (!firstName || !lastName || !email || !password || !confirmPassword) {
        formMessage.textContent = "Please fill in all fields.";
        formMessage.classList.add("error");
        formMessage.style.display = "block";
        return;
      }

      if (password !== confirmPassword) {
        formMessage.textContent = "Passwords do not match.";
        formMessage.classList.add("error");
        formMessage.style.display = "block";
        return;
      }

      try {
        const response = await fetch("http://localhost:3000/professor/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            firstName: firstName,
            lastName: lastName,
            email: email,
            password: password
          })
        });

        const data = await response.json();

        if (response.ok) {
          formMessage.textContent = "Account created successfully. Redirecting to login...";
          formMessage.classList.add("success");
          formMessage.style.display = "block";

          setTimeout(() => {
            window.location.href = "professor-login.html";
          }, 1200);
        } else {
          formMessage.textContent = data.error || "Could not create account.";
          formMessage.classList.add("error");
          formMessage.style.display = "block";
        }

      } catch (error) {
        console.log("Registration error:", error);
        formMessage.textContent = "Server error.";
        formMessage.classList.add("error");
        formMessage.style.display = "block";
      }
    });
  </script>

</body>
</html>
