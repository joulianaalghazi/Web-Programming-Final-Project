<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Course Companion — Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="student-app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>
  <div id="layout" class="grid-container collapsed">

    <header class="header">
      <h1>Student Course Companion</h1>
      <div class="header-right">
        <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
        <span class="role">Student</span>
      </div>
    </header>

    <nav id="nav">
      <div id="head">
        <div id="logo"></div>
        <i class="fa fa-bars" id="bars"></i>
        <div id="table_nav">Table</div>
        <i class="fa fa-times" id="times"></i>
      </div>

      <a href="student-dashboard.html"><i class="fa-solid fa-chart-simple"></i>Dashboard</a>
      <a href="student-courses.html"><i class="fa-solid fa-book"></i>Courses</a>
      <a href="student-progress.html"><i class="fa-solid fa-chart-line"></i>Progress</a>
      <a href="student-profile.html"><i class="fa-solid fa-user"></i>Profile</a>
      <a href="#" id="sign"><i class="fa-solid fa-sign-out-alt"></i>Sign Out</a>
    </nav>

    <main class="main-content">

  <div class="page">
<h2 class="page-title">Profile</h2>
      <p class="sub">Enter your information.</p>

      <div class="card" style="max-width:600px;">

        <label class="label">
          Name
          <input class="input" id="profileName" type="text" placeholder="e.g., Jouliana Alghazi">
        </label>

        <label class="label">
          Email
          <input class="input" id="profileEmail" type="email" placeholder="e.g., you@example.com">
        </label>

        <div class="actions">
          <button class="btn primary" id="saveProfileBtn" type="button">Save</button>
        </div>

      </div>

  </div>
</main>

    <footer class="footer">
      <p>&copy; Student Course Companion</p>
    </footer>

  </div>

  <script src="student-app.js"></script>

<script>
  //DARK MODE
const themeToggle = document.getElementById("themeToggle");

// load saved theme
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark-mode");
  themeToggle.textContent = "☀️ Light Mode";
}

themeToggle.addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");

  if (document.body.classList.contains("dark-mode")) {
    localStorage.setItem("theme", "dark");
    themeToggle.textContent = "☀️ Light Mode";
  } else {
    localStorage.setItem("theme", "light");
    themeToggle.textContent = "🌙 Dark Mode";
  }
});

  const studentUser = JSON.parse(localStorage.getItem("studentUser") || "null");

  if (!studentUser) {
    window.location.href = "student-login.html";
  }
</script>

</body>
</html>
